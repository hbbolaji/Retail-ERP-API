[package]
name = "retail_erp_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chromiumoxide = "0.9.1"
chrono = {version = "0.4.45", features=["serde"]}
dotenvy = "0.15.7"
futures = "0.3.34"
regex = "1.13.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["derive", "macros", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
